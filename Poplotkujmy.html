
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poplotkujmy 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #ff70b8;
      --purple: #8b5cf6;
      --dark: #29223b;
      --light: #fff5fb;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--dark);
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 15px #0000000a;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      color: var(--purple);
    }

    .logo span {
      color: var(--pink);
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(135deg, #ffe0ef, #e8dcff);
    }

    .hero h1 {
      font-size: clamp(30px, 5vw, 45px);
      margin-bottom: 12px;
    }

    .hero p {
      color: #655a77;
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px #00000008;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 18px;
    }

    input, textarea, select {
      width: 100%;
      font: inherit;
      padding: 13px;
      border: 1px solid #e5d9ef;
      border-radius: 10px;
      margin-bottom: 12px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      background: var(--pink);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
    }

    .btn:hover {
      background: var(--purple);
    }

    .secondary {
      background: #f1e8ff;
      color: var(--purple);
    }

    .auth-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .status {
      margin-top: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .muted {
      color: #91869d;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #f2e5ff;
      display: grid;
      place-items: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .post-header small {
      display: block;
      color: #91869d;
      margin-top: 4px;
    }

    .tag {
      display: inline-block;
      background: #f4eaff;
      color: #8655c7;
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .post-text {
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      border-top: 1px solid #f1eaf5;
      padding-top: 15px;
      margin-top: 18px;
    }

    .action {
      background: none;
      border: none;
      color: #776b86;
      font-size: 14px;
    }

    .action:hover,
    .action.liked {
      color: #ed4c94;
    }

    .comments {
      display: none;
      margin-top: 15px;
    }

    .comments.open {
      display: block;
    }

    .comment {
      background: #faf5ff;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    .comment small {
      display: block;
      color: #91869d;
      margin-bottom: 5px;
    }

    .empty {
      text-align: center;
      color: #91869d;
      padding: 25px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #91869d;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 5%;
      }

      .container {
        margin: 20px auto;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Poplotkuj<span>my</span> 💬</div>
    <span id="headerUser" class="muted"></span>
  </header>

  <section class="hero">
    <h1>Masz coś do powiedzenia? 💗</h1>
    <p>
      Ploteczki, przemyślenia i codzienne historie.<br>
      Wszystko w jednym miejscu!
    </p>
  </section>

  <main class="container">

    <!-- REJESTRACJA I LOGOWANIE -->

    <section class="card" id="authCard">
      <h2>Dołącz do Poplotkujmy 💌</h2>

      <form id="authForm">
        <input
          id="email"
          type="email"
          placeholder="Twój adres e-mail"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Hasło (minimum 6 znaków)"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <div class="auth-actions">
          <button class="btn" type="submit">
            Zaloguj się
          </button>

          <button class="btn secondary" type="button" id="register">
            Załóż konto
          </button>
        </div>
      </form>

      <p id="authStatus" class="status muted" aria-live="polite"></p>
    </section>

    <!-- PANEL UŻYTKOWNIKA -->

    <section id="userPanel" class="card hidden">
      <h2>Witaj na Poplotkujmy! 💗</h2>
      <p id="welcome" class="muted"></p>

      <button class="btn secondary" id="logout">
        Wyloguj się
      </button>
    </section>

    <!-- DODAWANIE WPISÓW -->

    <section id="composer" class="card hidden">
      <h2>Co u Ciebie słychać? 💭</h2>

      <form id="postForm">
        <textarea
          id="postText"
          maxlength="500"
          placeholder="Napisz coś ciekawego..."
          required
        ></textarea>

        <select id="category">
          <option value="Codzienność">🌸 Codzienność</option>
          <option value="Szkoła">📚 Szkoła</option>
          <option value="Przyjaźń">💗 Przyjaźń</option>
          <option value="Miłość">💕 Miłość</option>
          <option value="Inne">✨ Inne</option>
        </select>

        <button class="btn" id="publish" type="submit">
          Opublikuj 💌
        </button>

        <p id="postStatus" class="status muted"></p>
      </form>
    </section>

    <!-- WSPÓLNE WPISY -->

    <section>
      <h2>Ostatnie ploteczki ✨</h2>

      <div id="posts">
        <div class="card empty">
          Ładowanie wpisów...
        </div>
      </div>
    </section>

  </main>

  <footer>
    Poplotkujmy © 2026 · Pisz z życzliwością 💗
  </footer>

  <script type="module">

    // FIREBASE

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp,
      doc,
      updateDoc,
      arrayUnion,
      arrayRemove
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


    // WSTAW SWOJĄ KONFIGURACJĘ FIREBASE

    const firebaseConfig = {
      apiKey: "AIzaSyAliIiInRapqcZzz05I12SjXJKQ4TVggfo",
      authDomain: "poplotkujmy-812cd.firebaseapp.com",
      projectId: "poplotkujmy-812cd",
      storageBucket: "poplotkujmy-812cd.firebasestorage.app",
      messagingSenderId: "888174280353",
      appId: "1:888174280353:web:288239f64c13b2ec0a3ae0"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // SKRÓT DO ELEMENTÓW STRONY

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let postsCache = [];
    let unsubscribePosts = null;


    // KOMUNIKATY

    function setStatus(id, message) {
      $(id).textContent = message;
    }

    function showError(error) {
      console.error(error);

      const messages = {
        "auth/email-already-in-use":
          "Ten adres e-mail ma już konto.",

        "auth/invalid-credential":
          "Nieprawidłowy e-mail lub hasło.",

        "auth/weak-password":
          "Hasło jest za słabe.",

        "auth/invalid-email":
          "Podaj poprawny adres e-mail.",

        "auth/network-request-failed":
          "Sprawdź połączenie z internetem."
      };

      return messages[error.code] ||
        "Coś poszło nie tak. Spróbuj ponownie.";
    }


    // REJESTRACJA

    $("register").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || password.length < 6) {
        setStatus(
          "authStatus",
          "Wpisz e-mail i hasło o długości minimum 6 znaków."
        );
        return;
      }

      try {
        setStatus("authStatus", "Tworzenie konta...");

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        setStatus("authStatus", "Konto zostało utworzone!");
      } catch (error) {
        setStatus("authStatus", showError(error));
      }
    });


    // LOGOWANIE

    $("authForm").addEventListener("submit", async event => {
      event.preventDefault();

      try {
        setStatus("authStatus", "Logowanie...");

        await signInWithEmailAndPassword(
          auth,
          $("email").value.trim(),
          $("password").value
        );

        setStatus("authStatus", "Zalogowano!");
      } catch (error) {
        setStatus("authStatus", showError(error));
      }
    });


    // WYLOGOWANIE

    $("logout").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        setStatus("authStatus", showError(error));
      }
    });


    // SPRAWDZANIE, CZY UŻYTKOWNIK JEST ZALOGOWANY

    onAuthStateChanged(auth, user => {
      currentUser = user;

      $("authCard").classList.toggle("hidden", !!user);
      $("userPanel").classList.toggle("hidden", !user);
      $("composer").classList.toggle("hidden", !user);

      $("headerUser").textContent = user
        ? "Zalogowano"
        : "";

      $("welcome").textContent = user
        ? "Jesteś zalogowana na swoim koncie."
        : "";

      if (!user) {
        setStatus("authStatus", "Zaloguj się, aby dodawać wpisy.");
      }

      renderPosts();
    });


    // DODAWANIE WPISU DO BAZY

    $("postForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!currentUser) {
        setStatus("postStatus", "Najpierw się zaloguj.");
        return;
      }

      const text = $("postText").value.trim();
      const category = $("category").value;

      if (!text) return;

      $("publish").disabled = true;
      setStatus("postStatus", "Publikowanie...");

      try {
        await addDoc(collection(db, "posts"), {
          text: text,
          category: category,
          author: currentUser.uid,
          createdAt: serverTimestamp(),
          likes: [],
          comments: []
        });

        $("postText").value = "";

        setStatus("postStatus", "Wpis został opublikowany! 💗");
      } catch (error) {
        console.error(error);

        setStatus(
          "postStatus",
          "Nie udało się opublikować wpisu. Sprawdź konfigurację Firebase."
        );
      } finally {
        $("publish").disabled = false;
      }
    });


    // POBIERANIE WPISÓW NA BIEŻĄCO

    function listenToPosts() {
      if (unsubscribePosts) {
        unsubscribePosts();
      }

      const q = query(
        collection(db, "posts"),
        orderBy("createdAt", "desc")
      );

      unsubscribePosts = onSnapshot(
        q,
        snapshot => {
          postsCache = snapshot.docs.map(item => ({
            id: item.id,
            ...item.data()
          }));

          renderPosts();
        },
        error => {
          console.error(error);

          $("posts").textContent =
            "Nie udało się pobrać wpisów. Sprawdź Firebase.";
        }
      );
    }


    // TWORZENIE ELEMENTÓW STRONY

    function element(tag, className, text) {
      const el = document.createElement(tag);

      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;

      return el;
    }


    // WYŚWIETLANIE WPISÓW

    function renderPosts() {
      const container = $("posts");
      container.replaceChildren();

      if (postsCache.length === 0) {
        container.appendChild(
          element(
            "div",
            "card empty",
            "Nie ma jeszcze wpisów. Dodaj pierwszą ploteczkę! 💗"
          )
        );

        return;
      }

      postsCache.forEach(post => {
        const card = element("article", "card");

        const header = element("div", "post-header");
        const avatar = element("div", "avatar", "💗");
        const author = element("div");

        const name = element("strong", "", "Użytkownik");

        const dateText = post.createdAt?.toDate
          ? post.createdAt.toDate().toLocaleString("pl-PL", {
              day: "numeric",
              month: "short",
              hour: "2-digit",
              minute: "2-digit"
            })
          : "Przed chwilą";

        const date = element("small", "", dateText);

        author.append(name, date);
        header.append(avatar, author);

        const tag = element(
          "span",
          "tag",
          "# " + (post.category || "Inne").toLowerCase()
        );

        const text = element(
          "p",
          "post-text",
          post.text || ""
        );

        const actions = element("div", "post-actions");

        const likes = Array.isArray(post.likes)
          ? post.likes
          : [];

        const comments = Array.isArray(post.comments)
          ? post.comments
          : [];

        const liked = currentUser &&
          likes.includes(currentUser.uid);


        // POLUBIENIE

        const likeButton = element(
          "button",
          "action" + (liked ? " liked" : ""),
          `♥ ${likes.length} Polubień`
        );

        likeButton.disabled = !currentUser;

        likeButton.onclick = async () => {
          if (!currentUser) return;

          const postRef = doc(db, "posts", post.id);

          try {
            if (likes.includes(currentUser.uid)) {
              await updateDoc(postRef, {
                likes: arrayRemove(currentUser.uid)
              });
            } else {
              await updateDoc(postRef, {
                likes: arrayUnion(currentUser.uid)
              });
            }
          } catch (error) {
            alert("Nie udało się zapisać polubienia.");
            console.error(error);
          }
        };


        // KOMENTARZE

        const commentButton = element(
          "button",
          "action",
          `💬 ${comments.length} Komentarzy`
        );

        const commentBox = element("div", "comments");
        const commentList = element("div");

        comments.forEach(comment => {
          const item = element("div", "comment");

          const commentAuthor = element(
            "small",
            "",
            "Użytkownik"
          );

          const commentText = element(
            "div",
            "",
            comment.text || ""
          );

          item.append(commentAuthor, commentText);
          commentList.appendChild(item);
        });

        const commentForm = document.createElement("form");
        const commentInput = document.createElement("input");

        commentInput.placeholder = "Napisz komentarz...";
        commentInput.maxLength = 200;
        commentInput.required = true;
        commentInput.disabled = !currentUser;

        const commentSubmit = element(
          "button",
          "btn",
          "Dodaj komentarz"
        );

        commentSubmit.type = "submit";
        commentSubmit.disabled = !currentUser;

        commentForm.append(commentInput, commentSubmit);

        commentForm.addEventListener("submit", async event => {
          event.preventDefault();

          if (!currentUser) return;

          const commentText = commentInput.value.trim();

          if (!commentText) return;

          try {
            await updateDoc(doc(db, "posts", post.id), {
              comments: arrayUnion({
                uid: currentUser.uid,
                text: commentText
              })
            });
          } catch (error) {
            alert("Nie udało się dodać komentarza.");
            console.error(error);
          }
        });

        commentBox.append(commentList, commentForm);

        commentButton.onclick = () => {
          commentBox.classList.toggle("open");
        };

        actions.append(likeButton, commentButton);

        card.append(
          header,
          tag,
          text,
          actions,
          commentBox
        );

        container.appendChild(card);
      });
    }


    // URUCHOMIENIE BAZY DANYCH

    listenToPosts();

  </script>

</body>
</html>
